# Resolution map: capability x platform.
# GENERATED. Do not edit this file; edit the canonical per-platform
# sources it is built from and rebuild. This header names no path because
# the file ships to a repository where those paths do not exist.
# Multi-document YAML, one document per platform. Use yaml.safe_load_all.
#
# Every platform fact here is dated. A row older than its platform's last
# UI change is a bug, and the branch instruction that cites it is wrong.
---
# Resolution map fragment: ChatGPT
# Merged into the product's resolution map. One entry per capability id in vocabulary.md
# that is installable in v0.1. Facts checked against public sources on the date below;
# UI labels and plan gates on this platform change often, so every row states its own
# confidence and the branch text is written to ask rather than assert where confidence is low.

platform: chatgpt
checked: 2026-08-06
capabilities:

  web.fetch:
    mechanism: "Built-in web search and browsing in chat, also available inside a scheduled run"
    requires: "any plan, including Free"
    limits: "message rate limits bite first on Free; paywalled or blocking sites are unreachable; inside a scheduled task a run happens at most hourly"
    degrades_to: "installer pastes the source content into the conversation at run time, recorded as substituted"
    confidence: high
    note: "The only capability in this branch with no setup step and no plan gate."

  email.read:
    mechanism: "First-party Gmail or Outlook connector, connected by the installer in Settings"
    requires: "paid plan (Go, Plus, Pro, Business, Enterprise, Edu); not available on Free; admin-enabled on Business, Enterprise and Edu"
    limits: "read and search only within the v0.1 envelope; no inbox triggers and no monitoring, a run sees the mailbox only at the moment it runs; the connector on paid plans can also send with per-message approval as of mid-2026, which this envelope never enables"
    degrades_to: "installer pastes or uploads the relevant messages, on-demand only; otherwise lost"
    confidence: medium
    note: "Plan gate is well attested. The Settings menu label is not: it has been Connectors, then Apps, and at least one 2026 source reports it under Plugins. Ask the installer to read out what they see rather than naming a path."

  calendar.read:
    mechanism: "First-party Google Calendar or Outlook Calendar connector, connected in Settings"
    requires: "paid plan; not available on Free; admin-enabled on Business, Enterprise and Edu"
    limits: "read only on consumer plans; workspace plans gained calendar write actions during 2026 behind an admin toggle, which this envelope never requests or uses"
    degrades_to: "installer pastes the day's agenda at run time, on-demand only; otherwise lost"
    confidence: medium
    note: "Same menu-label uncertainty as email.read. Verify in Settings with the installer; this surface changed during 2026."

  files.read:
    mechanism: "Upload into the conversation (all plans), or a cloud drive connector such as Google Drive, OneDrive, SharePoint, Dropbox or Box (paid)"
    requires: "upload: any plan, with a low daily cap on Free reported as 3 files per day. Drive connector: paid plan"
    limits: "decisive limit: as of July 2026 a scheduled task cannot read files uploaded to a conversation, cannot read a Project's files, and cannot run inside a custom GPT. A scheduled agent that needs documents must use a connected drive or carry the content inside the task instruction"
    degrades_to: "content inlined into the task instruction (frozen at install time), or the agent runs on-demand with an upload each time, which costs the schedule"
    confidence: medium
    note: "The scheduled-task file exclusion is single-sourced and dated July 2026. It shapes the whole branch, so re-verify it before relying on it; if it has been lifted, the scheduled case simplifies."

  memory.prefs:
    mechanism: "ChatGPT memory: saved memories plus referencing past chats, under Settings, personalization"
    requires: "any plan; lightweight recall on Free, longer-term on paid"
    limits: "installer can have it switched off; saved memory is capacity-capped and old entries get displaced; whether a scheduled run reliably reads saved memories is unverified"
    degrades_to: "preferences and slot answers written into the task instruction text instead, recorded as substituted"
    confidence: low
    checked: 2026-08-10
    note: "Never let correctness depend on this. The branch instructs that all slot answers live in the instruction text, and that the installer verifies any saved entry on their own memory settings screen rather than trusting the assistant's claim. Consequence for a declared state: block: there is no place on this platform to keep a per-run snapshot inside the envelope, since a scheduled run reads no uploaded or Project file, memory in a scheduled run is unverified, and writing a snapshot into a connected drive is a write to an external system. A declared state: block is therefore a lost row, and the branch carries the wording."

  chat.notify:
    mechanism: "deliver the output to the installer over any channel whose only recipient is the installer: the conversation for an on-demand agent; the scheduled tasks view for a scheduled one; a push notification on their device and an email to their own account address on run completion, both set under Settings, notifications"
    requires: "in-chat output: any plan. Notifications from a scheduled run: paid, because the scheduler is paid. The channel is chosen by the installer and the target is always a personal slot, never a value the passport carries"
    limits: "notifies the account holder only; the completion email goes to the installer's own account and must never be extended to other recipients, which would be email.send and outside the envelope; the boundary lives in the task instruction text, which must say the agent delivers to the installer and composes no other recipient"
    confidence: medium
    degrades_to: "output stays in the conversation and the installer reads it when they open it"
    checked: 2026-08-10
    note: "Widened because delivery is a channel the installer chooses: delivery is a channel the installer chooses, not a capability to refuse. Notification channels are user- and device-permission dependent, so confirm delivery with the installer after the first run rather than assuming."

  schedule.run:
    mechanism: "Scheduled Tasks: created by describing the task and its timing in chat, managed from the Scheduled view in the sidebar (dedicated page added June 2026)"
    requires: "paid plan; not available on Free"
    limits: "active task caps reported as Go 3, Plus 5, Business and Edu 10, Pro and Enterprise 15; a task runs at most once per hour; ignored tasks can auto-pause; no file uploads, Project files or custom GPTs inside a run, so the instruction must be self-contained; no human in the loop during a run"
    degrades_to: "on-demand pinned conversation or saved prompt, recorded as loss"
    confidence: medium
    note: "Feature existence and the paid gate are solid; the per-plan numbers come from June 2026 reporting, not from a primary page, and the sidebar label may differ per build. The ~1500 character instruction budget is a product choice, not a verified platform limit. Never delete or pause an installer's existing task to free a slot."
---
platform: claude-ai
checked: 2026-08-06
capabilities:

  web.fetch:
    mechanism: "Built-in web search, plus reading public pages the assistant is pointed at"
    requires: "all plans, Free included"
    limits: "On Free, searches draw on the same daily usage limit as everything else. Nothing behind the owner's login is reachable this way."
    degrades_to: "Nothing. If search is unavailable in the moment, the installer pastes the source text into the chat and the run is manual."
    confidence: high
    note: "Announced as available to all users including Free; verified against Anthropic's own web search announcement."

  email.read:
    mechanism: "Gmail connector, part of the first-party Google Workspace connectors"
    requires: "all plans on claude.ai and Claude Desktop; on Team and Enterprise an Owner or Primary Owner must enable connectors at the organization level before a user can authenticate"
    limits: "Gmail only, no other mail providers first-party. Attachment contents are not readable, metadata only. Some advanced Gmail search filters are unsupported. Google API rate limits apply. The connector also grants draft creation, which the read-notify envelope forbids using; it cannot send."
    degrades_to: "The installer supplies the relevant messages by hand at run time, or the input is dropped and recorded as lost."
    confidence: high
    note: "Help centre wording is 'available for all users on Claude and Claude Desktop'; some third-party writeups claim paid-only, so have the installer confirm what they see."

  calendar.read:
    mechanism: "Google Calendar connector, part of the first-party Google Workspace connectors"
    requires: "all plans on claude.ai and Claude Desktop; same organization-level gate on Team and Enterprise as Gmail"
    limits: "Google Calendar only. Reads only the calendars of the connected Google account. The connector also grants create, update and delete on events, which the envelope forbids using; the branch must say this out loud to the installer."
    degrades_to: "The installer pastes the day's or week's events into the chat at run time, or the input is dropped and recorded as lost."
    confidence: high

  files.read:
    mechanism: "Upload to Project knowledge for stable documents; Google Drive connector for a live folder or document set"
    requires: "Project knowledge on all plans, Free capped at five projects; Drive connector on all plans with the same Team and Enterprise organization gate"
    limits: "Drive extracts text only, images embedded in documents are not processed. No first-party connector for Dropbox, OneDrive or a local folder from claude.ai chat. The Drive connector also grants file upload and folder creation, which the envelope forbids using. On paid plans large knowledge bases switch to retrieval rather than full context, so a specific line may not be seen on every run."
    degrades_to: "Installer uploads the documents into Project knowledge manually, refreshed by hand when they change."
    confidence: high

  memory.prefs:
    mechanism: "Claude memory, scoped per Project, each Project holding its own separate memory space and summary"
    requires: "Free, Pro and Max on the current memory experience; Enterprise runs a legacy arrangement with organization-level controls. Searching past chats is a separate feature and is paid plans only."
    limits: "Memory is a generated summary of conversations, not a store the agent can rely on for correctness. It can be paused or reset by the owner. It does not carry between Projects, and a chat Project's memory is not the same store as a Cowork project's memory."
    degrades_to: "Preferences are written into the Project instructions instead, where they persist until edited and do not update on their own. Recorded as substituted."
    confidence: medium
    checked: 2026-08-10
    note: "Plan coverage verified in the help centre. Nothing official states how quickly a stated preference becomes durable, so the branch verifies by echo rather than by promise. Consequence for a declared state: block: there is nowhere inside the envelope to keep a per-run snapshot here. Project knowledge is uploaded by the installer by hand, memory is a generated summary rather than a store, and writing a file back into a connected Drive is a write to an external system. Cowork projects are documented as stored locally while their scheduled runs are documented as executing in the cloud, so whether a Cowork run could write a local snapshot is contradictory in the sources and unverified; do not build on it. A declared state: block is a lost row."

  chat.notify:
    mechanism: "deliver the output to the installer. Two channels only: the chat inside the Project for an on-demand agent, and the Cowork scheduled task's run view for a scheduled one. The Project itself is the installed agent, built from Set project instructions plus project knowledge"
    requires: "all plans, Free capped at five projects; the channel is chosen by the installer and the target is always a personal slot, never a value the passport carries"
    limits: "No documented character ceiling on Project instructions, so the functional spec goes in whole. Scheduled runs do not deliver here: their output appears in the scheduled task's run view, not in the Project chat. Mail to the installer's own address is not available as a channel: the first-party Gmail connector can create drafts but cannot send, and a draft is not delivery, so the branch offers no mail route rather than inventing one."
    degrades_to: "Nothing. The Project chat is always present."
    confidence: medium
    checked: 2026-08-10
    note: "Widened because delivery is a channel the installer chooses, and narrowed by the platform: delivery is a channel the installer chooses, and this platform has fewer channels than the others. Confidence is medium only on the absence of an instruction-length ceiling: no published limit was found, which is not the same as a published absence of one."

  schedule.run:
    mechanism: "Scheduled task in Claude Cowork, created inside a Cowork project, run in the cloud"
    requires: "paid plans only, Pro, Max, Team and Enterprise; Cowork is in beta and availability by surface has been rolling out plan by plan"
    limits: "Not available in ordinary claude.ai chats or chat Projects. Cowork projects are documented as desktop-only and stored locally, with an Import from project option that pulls instructions and files across from a chat Project, so the agent exists twice and the two copies can drift. Documented cadences: hourly, daily, weekly, weekdays, manual. No published cap on task count; do not state one. Runs execute unattended, so the envelope matters more here, not less."
    degrades_to: "On-demand. The installer opens the Project and asks for a run. Recorded as lost, with the losses wording: nothing runs while you are away."
    confidence: low
    note: "Fastest-moving row in this file. The branch instructs the assistant to ask the installer what they actually see in the sidebar and to adapt, rather than narrating a UI path."
